name: CI/CD Pipeline

on:
  push:
    branches: [ "koval" ]
  pull_request:
    branches: [ "koval" ]

permissions:
  contents: read

env:
  DOTNET_VERSION: "9.0.x"
  WEB_CSPROJ: "CheckIT.Web/CheckIT.Web.csproj"
  TEST_CSPROJ: "CheckIT.Tests/CheckIT.Tests.csproj"
  # Docker image name in DockerHub (repo must exist or auto-create depending on DockerHub settings)
  IMAGE_NAME: "${{ secrets.DOCKERHUB_USERNAME }}/checkit-web"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore (ignore NuGet vulnerability audit failures)
        run: dotnet restore ${{ env.WEB_CSPROJ }} 

      - name: Build
        run: dotnet build ${{ env.WEB_CSPROJ }} 

      - name: Run tests
        run: dotnet test ${{ env.TEST_CSPROJ }}

      - name: Check migrations folder exists
        run: |
          test -d "CheckIT.Web/Data/Migrations"
          ls -la "CheckIT.Web/Data/Migrations"

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && success()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.MY_DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max