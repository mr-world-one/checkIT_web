name: Artym CI/CD Pipeline
on:
  push:
    branches: [ "artym" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    
    - name: Restore dependencies
      run: dotnet restore Application/CheckIT.Web/CheckIT.Web.csproj
    
    - name: Build
      run: dotnet build Application/CheckIT.Web/CheckIT.Web.csproj --no-restore --configuration Release
    
    - name: Run tests
      run: dotnet test CheckIT.Tests/CheckIT.Tests.csproj --verbosity normal

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: success()
    steps:
    - uses: actions/checkout@v4
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME_ARTYM }}
        password: ${{ secrets.DOCKERHUB_TOKEN_ARTYM }}
    
    - name: Build and Push Docker image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME_ARTYM }}/artym_checkit:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME_ARTYM }}/artym_checkit:latest