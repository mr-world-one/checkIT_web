name: CI/CD Pipeline

on:
  push:
    branches: [ "koval" ]
  pull_request:
    branches: [ "koval" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    
    - name: Restore dependencies
      run: dotnet restore Application/CheckIT.Web/CheckIT.Web.csproj

    - name: Build
      run: dotnet build Application/CheckIT.Web/CheckIT.Web.csproj --no-restore --configuration Release

    - name: Run tests
      run: dotnet test CheckIT.Tests/CheckIT.Tests.csproj 
    - name: Check migrations folder exists
      run: |
          test -d "Application/CheckIT.Web/Data/Migrations"
          ls -la "Application/CheckIT.Web/Data/Migrations"

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.MY_DOCKERHUB_TOKEN }}
    
    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/checkit-web:latest .
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/checkit-web:${{ github.sha }} .
    
    - name: Push to Docker Hub
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/checkit-web:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/checkit-web:${{ github.sha }}
